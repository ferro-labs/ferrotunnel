name: Nightly Fuzzing

on:
  schedule:
    - cron: '0 2 * * 1,3,5' # 2 AM UTC on Mon, Wed, Fri
  workflow_dispatch: # Allow manual trigger for testing

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-nightly:
    name: Nightly Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz codec_decode (25 min)
        run: cd ferrotunnel-protocol && cargo +nightly fuzz run codec_decode --sanitizer=none -- -max_total_time=1500

      - name: Fuzz frame_validation (25 min)
        run: cd ferrotunnel-protocol && cargo +nightly fuzz run frame_validation --sanitizer=none -- -max_total_time=1500
